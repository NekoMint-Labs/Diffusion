name: Background capture diagnostic

# Temporary, manual-only investigation on the isolated branch; remove from final diff.
on:
  workflow_dispatch:
    inputs:
      modes:
        description: Space-separated single-variable capture modes
        default: baseline mounted ready
        required: true
        type: string
      trials:
        description: Independent full-project runs per mode (not retries)
        default: '3'
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare captures without suppressing any failure
        env:
          MODES: ${{ inputs.modes }}
          TRIALS: ${{ inputs.trials }}
          DEBUG: pw:browser
        run: |
          mkdir -p verification/hosted-capture
          uname -a
          free -h
          df -h /dev/shm
          node --version
          pnpm exec playwright --version
          status=0
          for mode in $MODES; do
            case "$mode" in baseline|mounted|ready|delay|element) ;; *) exit 2 ;; esac
            for trial in $(seq 1 "$TRIALS"); do
              echo "CAPTURE EXPERIMENT mode=$mode trial=$trial"
              CAPTURE_DIAGNOSTIC="$mode" pnpm exec playwright test --project=production-backgrounds --workers=1 --retries=0 --reporter=line --output="test-results/$mode-$trial" > "verification/hosted-capture/$mode-$trial.log" 2>&1 || status=1
            done
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-background-capture-${{ github.run_id }}
          retention-days: 14
          path: |
            verification/hosted-capture/
            test-results/
