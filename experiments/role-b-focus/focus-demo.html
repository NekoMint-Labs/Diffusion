<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重点阅读实验 · Developer B</title>
<style>
:root{color-scheme:light dark;--paper:light-dark(#f8f6f1,#202422);--ink:light-dark(#2e342f,#efeee7);--muted:light-dark(#656b63,#bbbeb6);--line:light-dark(#dcded4,#4b514b);--blue:light-dark(#386582,#a3c9dd);--wash:light-dark(#eaf0ef,#2d3c3e);--mark:light-dark(#efe1bb,#5c5030);--tile:light-dark(#fffdf9,#282d29)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1020px;margin:auto;padding:34px 28px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}header b{font-weight:550}small,.muted{color:var(--muted);font-size:13px}h1{font:500 29px/1.5 "Noto Serif SC",SimSun,serif;margin:12px 0}h2{font:500 25px/1.65 "Noto Serif SC",SimSun,serif;margin:8px 0 18px}p{margin:12px 0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button,select{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 15px;cursor:pointer}button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.question{border-top:1px solid var(--line);padding:20px 0;margin:0 0 25px}.question p{max-width:750px}.constraint{font-size:14px;color:var(--blue)}article{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:28px 30px;box-shadow:0 8px 32px #00000005}.label{font-size:13px;letter-spacing:.08em;color:var(--blue)}.conditions{background:var(--wash);padding:12px 16px;border-radius:7px;font-size:15px}.conditions b{font-weight:600}.details{font-family:SimSun,serif;font-size:20px;line-height:1.95}.details p{margin:20px 0}mark{background:var(--mark);color:var(--ink);padding:.08em .1em;border-radius:3px}summary{cursor:pointer;color:var(--blue);padding:16px 0 0;width:fit-content}.rail{display:grid;grid-template-columns:240px 1fr;gap:28px}.rail aside{border-right:1px solid var(--line);padding-right:24px}.rail aside h2{font-size:20px}.citation{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}.note{margin-top:22px;font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:650px){main{padding:20px 16px}header{align-items:flex-start;flex-direction:column;gap:8px}article{padding:20px}h2{font-size:23px}.rail{grid-template-columns:1fr}.rail aside{border-right:0;border-bottom:1px solid var(--line);padding:0 0 16px}nav button{padding:8px 10px;font-size:14px}}
</style><main><header><b>Diffusion / 重点阅读实验</b><small>人工编写的交互示例 · 未调用模型</small></header>
<h1>把重点提出来，也把成立条件留在眼前</h1><section class="question"><span class="label">当前问题</span><p>我想做一个面向大学生的 AI 学习工具，但不知道应该先验证什么。请先帮我找出最值得验证的一个问题，不要直接给完整开发方案。</p><div class="constraint">补充条件 · 每周四小时；先小范围验证；暂不开发完整产品</div></section>
<nav aria-label="重点呈现方式"><button type="button" data-mode="focus" aria-pressed="true">结论＋关键条件</button><button type="button" data-mode="mark" aria-pressed="false">原文重点标记</button><button type="button" data-mode="rail" aria-pressed="false">阅读边栏</button></nav>
<article aria-live="polite" id="surface"></article><p class="note">候选建议仍由用户判断是否保留。标记引用表示“原文确有这句话”，不表示建议已被证实。这三个样式只切换阅读方式。</p>
</main><script>
const surface=document.getElementById('surface');
const point='在每周四小时、先做小范围验证的限制下，先问：一名学生是否愿意把一次真实作业交给你试着辅助？';
const condition='不愿提供作业也可能源于隐私顾虑，不能直接判定没有需求。';
const detail='<p>先围绕一次真实作业观察对方是否愿意参与；暂时不用开发完整产品。得到反应后，再区分需求不足、隐私顾虑与参与成本。</p><p>这是开发者编写的候选思路，用来检验重点是否容易阅读。要判断真实模型能否稳定做到，需要保留相同问题、条件、模型与实际输出作对照。</p>';
const original='<p>换一个挑法：选那个“<mark>如果答案是否，你就会放弃这个方向</mark>”的问题。你说了不要完整开发方案，那这一步的产出可以只是一句判断——比如“学生现有的办法已经够用”，要是这个判断成立，工具的价值主张就还没立住；比先做功能更能决定下一步。</p>';
const basis='<div class="citation"><b>本次依据</b><p>原问题：“请先帮我找出最值得验证的一个问题”<br>补充条件：“我每周只能投入四小时”</p></div>';
function render(mode){for(const b of document.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b.dataset.mode===mode));
if(mode==='mark')surface.innerHTML='<span class="label">原文摘录 · 精确片段标记</span><div class="details">'+original+'</div><div class="conditions">标记可以帮助定位，但原回答没有整合新增的四小时条件；这个展示方式不能代替重新推理。</div>'+basis;
else if(mode==='rail')surface.innerHTML='<div class="rail"><aside><span class="label">候选重点 · 人工示例</span><h2>'+point+'</h2><div class="conditions">'+condition+'</div></aside><section><span class="label">详细说明</span><div class="details">'+detail+'</div>'+basis+'</section></div>';
else surface.innerHTML='<span class="label">候选重点 · 人工示例</span><h2>'+point+'</h2><div class="conditions"><b>判断边界</b> '+condition+'</div><details><summary>展开详细说明与依据</summary><div class="details">'+detail+'</div>'+basis+'</details>';
}for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>render(b.dataset.mode));render('focus');
</script></html>
