<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<style>text{font-family:"Microsoft YaHei",sans-serif;fill:#3d4040;font-size:15px}.small{font-size:13px;fill:#6b706e}.card{fill:#faf9f5;stroke:#d5d7d0;rx:10}.button{fill:#f4f5ef;stroke:#a9afa4;rx:8}</style>
<rect width="1280" height="720" fill="#eeeee8"/><text x="28" y="32">#49 本地设计提案 · 未审批 · 静态示意</text><text x="28" y="60">收起：不预留底部高度</text>
<rect class="card" x="520" y="145" width="310" height="100"/><text x="540" y="179">阅读区 A / 原本的想法</text><text class="small" x="540" y="207">打开和关闭面板本身不改变相机</text>
<rect class="card" x="850" y="320" width="310" height="100"/><text x="870" y="354">可显式定位的想法 B</text><text class="small" x="870" y="382">返回动作恢复 A 的相机与有效选择</text>
<rect class="card" x="530" y="625" width="650" height="62"/><text x="550" y="663">写作区：始终保留可操作空间</text>
<rect class="button" x="24" y="660" width="36" height="36"/><text x="29" y="684">览</text><rect class="button" x="68" y="660" width="36" height="36"/><text x="73" y="684">荐</text>
<text class="small" x="120" y="686">36px 入口；Field 高度始终 720px</text></svg>