name: Windows Package

on:
  pull_request:
    paths:
      - src-tauri/**
      - .github/workflows/windows-package.yml
  workflow_dispatch:
    inputs:
      preview:
        description: Build the isolated Next trial preview (separate app, data and credentials)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PACKAGE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_SOURCE }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled discovery engine
        run: pnpm run build:discovery

      - name: Check bundled discovery engine
        run: pnpm run check:discovery

      - name: Fetch Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Prepare distribution licenses
        run: pnpm run prepare:licenses

      - name: Test native code
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.preview }}
        run: pnpm run tauri build --bundles nsis

      - name: Build isolated preview NSIS installer
        if: ${{ github.event_name == 'pull_request' || inputs.preview }}
        run: pnpm run tauri build --config src-tauri/tauri.preview.conf.json --bundles nsis

      - name: Record source and installer hashes
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle/nsis'
          $lines = Get-ChildItem -LiteralPath $bundle -Filter '*.exe' | ForEach-Object {
            "$(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)"
          }
          $lines | Set-Content -LiteralPath "$bundle/SHA256SUMS.txt" -Encoding utf8
          [ordered]@{ sourceCommit = $env:PACKAGE_SOURCE; preview = '${{ github.event_name == 'pull_request' || inputs.preview }}'; run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' } |
            ConvertTo-Json | Set-Content -LiteralPath "$bundle/source.json" -Encoding utf8

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-windows-${{ env.PACKAGE_SOURCE }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/source.json
          if-no-files-found: error
          retention-days: 14
