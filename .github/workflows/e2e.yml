name: Playwright E2E

# Blocking mounted-application gate. Each runner keeps one worker and zero retries
# from playwright.config.ts; diagnose failures instead of weakening or hiding them.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      capture_diagnostic:
        description: Temporary isolated-branch capture investigation
        default: false
        type: boolean
      capture_modes:
        description: Space-separated single-variable modes
        default: baseline mounted ready
        type: string
      capture_trials:
        description: Independent full-project runs per mode (not retries)
        default: '3'
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interaction:
    name: Interaction ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run interaction shard
        run: pnpm exec playwright test --project=interaction --shard=${{ matrix.shard }}/3

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-interaction-${{ matrix.shard }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report/
            test-results/

  production-backgrounds:
    name: Production backgrounds ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.capture_diagnostic && '[1,2,3,4]' || '[1]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production backgrounds
        env:
          CAPTURE_EXPERIMENT: ${{ inputs.capture_diagnostic }}
          CAPTURE_MODES: ${{ inputs.capture_modes }}
          CAPTURE_TRIALS: ${{ inputs.capture_trials }}
          DEBUG: ${{ inputs.capture_diagnostic && 'pw:browser' || '' }}
        run: |
          if [ "$CAPTURE_EXPERIMENT" != true ]; then
            pnpm exec playwright test --project=production-backgrounds
            exit
          fi
          # Temporary manual-only diagnostics; preserve every failure in the job status.
          mkdir -p verification/hosted-capture
          uname -a
          free -h
          df -h /dev/shm
          node --version
          pnpm exec playwright --version
          [[ "$CAPTURE_TRIALS" =~ ^[1-9][0-9]?$ ]] || exit 2
          status=0
          for mode in $CAPTURE_MODES; do
            case "$mode" in original|baseline|mounted|ready|delay|element|contract|painted|isolated) ;; *) exit 2 ;; esac
            for trial in $(seq 1 "$CAPTURE_TRIALS"); do
              echo "CAPTURE EXPERIMENT mode=$mode trial=$trial"
              if [ "$mode" = original ]; then
                env -u CAPTURE_DIAGNOSTIC pnpm exec playwright test --project=production-backgrounds --workers=1 --retries=0 --reporter=line --output="test-results/$mode-$trial" > "verification/hosted-capture/$mode-$trial.log" 2>&1 || status=1
              elif [ "$mode" = isolated ]; then
                CAPTURE_DIAGNOSTIC=baseline pnpm exec playwright test tests/e2e/visual.spec.ts --grep 'Paper Day' --project=production-backgrounds --workers=1 --retries=0 --reporter=line --output="test-results/$mode-$trial" > "verification/hosted-capture/$mode-$trial.log" 2>&1 || status=1
              else
                CAPTURE_DIAGNOSTIC="$mode" pnpm exec playwright test --project=production-backgrounds --workers=1 --retries=0 --reporter=line --output="test-results/$mode-$trial" > "verification/hosted-capture/$mode-$trial.log" 2>&1 || status=1
              fi
            done
          done
          exit "$status"

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-backgrounds-${{ github.run_id }}-${{ matrix.lane }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            verification/hosted-capture/

  e2e-gate:
    name: E2E gate
    runs-on: ubuntu-latest
    if: always()
    needs: [interaction, production-backgrounds]
    steps:
      - name: Require every E2E job to succeed
        env:
          INTERACTION_RESULT: ${{ needs.interaction.result }}
          BACKGROUNDS_RESULT: ${{ needs.production-backgrounds.result }}
        run: |
          echo "Interaction: $INTERACTION_RESULT; backgrounds: $BACKGROUNDS_RESULT"
          test "$INTERACTION_RESULT" = success && test "$BACKGROUNDS_RESULT" = success
