name: Windows Package

on:
  pull_request:
    paths:
      - .gitattributes
      - src-tauri/**
      - .github/workflows/windows-package.yml
      - scripts/windows-package.mjs
      - tests/offline/windows-package.test.mjs
      - docs/experiments/WINDOWS_PREVIEW.md
  workflow_dispatch:
    inputs:
      profile:
        description: Fixed package profile (free-links requires its config in the selected ref)
        type: choice
        options:
          - stable
          - preview
          - field
          - free-links
        default: stable

permissions:
  contents: read

jobs:
  package:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PACKAGE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      INPUT_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_SOURCE }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate package profile and exact checkout
        id: package-plan
        run: node scripts/windows-package.mjs plan

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled discovery engine
        run: pnpm run build:discovery

      - name: Check bundled discovery engine
        run: pnpm run check:discovery

      - name: Fetch Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Prepare distribution licenses
        run: pnpm run prepare:licenses

      - name: Test native code
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        shell: pwsh
        env:
          PACKAGE_CONFIG: ${{ steps.package-plan.outputs.config }}
        run: |
          $buildArgs = @('run', 'tauri', 'build', '--bundles', 'nsis')
          if ($env:PACKAGE_CONFIG) { $buildArgs += @('--config', $env:PACKAGE_CONFIG) }
          & pnpm @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record source and installer hashes
        run: node scripts/windows-package.mjs record

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-windows-${{ steps.package-plan.outputs.profile }}-${{ env.PACKAGE_SOURCE }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/source.json
            src-tauri/target/release/bundle/nsis/INSTALL.md
          if-no-files-found: error
          retention-days: 14
